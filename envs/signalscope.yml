# conda environment for the tools SignalScope runs on the host (the callers that need a GPU run in
# Apptainer containers). Versions marked "tested" are those of the validation runs.
name: signalscope
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.8
  - snakemake-minimal=5.10.0     # tested
  - sniffles=2.7.5               # tested
  - cutesv=2.1.3                 # tested
  - minimap2
  - samtools
  - bcftools
  - htslib                       # bgzip, tabix
  - bedtools
  - whatshap=1.7                # tested (phasing and haplotag)
  - mosdepth
  - nanoplot
  - pandas
  - numpy
  - matplotlib
  - pysam
  - pillow
  - lxml                         # report_redesign.py (final report)
